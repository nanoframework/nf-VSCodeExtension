trigger:
  branches:
    include:
      - main
      - develop
      - release-*
  paths:
    exclude:
      - .github_changelog_generator
      - .gitignore
      - .markdownlint.json
      - CHANGELOG.md
      - LICENSE.md
      - README.md
      - assets/*
      - config/*
      - .github/*
      - .vscodeignore
      - .gitmodules
  tags:
    include: 
      - v*  
      - refs/tags/v*

# PR always trigger build
pr:
  autoCancel: true

# add nf-tools repo to resources (for Azure Pipelines templates)
resources:
  repositories:
    - repository: templates
      type: github
      name: nanoframework/nf-tools
      endpoint: nanoframework

pool:
  vmImage: 'windows-latest'

variables:
  - group: sign-client-credentials
  - name: DOTNET_NOLOGO
    value: true

steps:

  # need this here in order to persist GitHub credentials
  - checkout: self
    persistCredentials: true

  - pwsh: scripts/build.ps1
    displayName: Download and build dependencies for .NET nanoFramework

  - task: DeleteFiles@1
    displayName: Remove source folders
    condition: succeeded()
    inputs:
      Contents: |
        v*.zip

  - script: npm ci --legacy-peer-deps
    displayName: npm ci
    condition: succeeded()

  - script: npx gulp build-debug-bridge
    displayName: Build debug bridge
    condition: succeeded()

  # we don't have unit tests
  # - script: npm run test
  #   displayName: Run unit tests
  #   condition: succeeded()
    
  - script: npm run build:prod
    displayName: Build for production
    condition: succeeded()

  - script: npm run package
    env:
      PublicRelease: true
    displayName: Package extension
    condition: succeeded()

  - pwsh: |
      Add-Type -AssemblyName System.IO.Compression
      Add-Type -AssemblyName System.IO.Compression.FileSystem

      $vsixPath = "$(Build.Repository.LocalPath)\vscode-nanoframework.vsix"
      if (-not (Test-Path -LiteralPath $vsixPath)) {
        throw "VSIX not found: $vsixPath"
      }

      $archive = [System.IO.Compression.ZipFile]::OpenRead($vsixPath)
      try {
        $entries = @($archive.Entries)
        $duplicate = $entries |
          Group-Object FullName -CaseSensitive:$false |
          Where-Object Count -gt 1 |
          Select-Object -First 1
        if ($duplicate) {
          throw "VSIX contains duplicate path: $($duplicate.Name)"
        }

        foreach ($requiredPath in @('[Content_Types].xml', 'extension.vsixmanifest', 'extension/package.json')) {
          if (-not ($entries | Where-Object FullName -CEQ $requiredPath)) {
            throw "VSIX is missing required entry: $requiredPath"
          }
        }

        foreach ($entry in $entries) {
          if ($entry.FullName.EndsWith('/')) {
            continue
          }

          $entryStream = $entry.Open()
          try {
            $entryStream.CopyTo([System.IO.Stream]::Null)
          }
          finally {
            $entryStream.Dispose()
          }
        }
      }
      finally {
        $archive.Dispose()
      }

      Write-Host "Validated VSIX: $((Get-Item -LiteralPath $vsixPath).Length) bytes"
    displayName: Validate VSIX package
    condition: succeeded()

  - script: dotnet build scripts/VsixSignTool/VsixSignTool.csproj -c Release
    displayName: Build VSIX signing tool
    condition: >-
      and(
        succeeded(),
        or(
          startsWith(variables['Build.SourceBranch'], 'refs/tags/v')
        )
      )

  - script: >-
      npx vsce generate-manifest
      --packagePath .\vscode-nanoframework.vsix
      --out .\vscode-nanoframework.signature.manifest
    displayName: Generate VSIX signature manifest
    condition: >-
      and(
        succeeded(),
        or(
          startsWith(variables['Build.SourceBranch'], 'refs/tags/v')
        )
      )

  - pwsh: |
      .\scripts\sign-vsix.cmd `
        .\vscode-nanoframework.signature.manifest `
        .\vscode-nanoframework.signature.p7s
      if ($LASTEXITCODE -ne 0) {
        throw "Failed to sign VSIX manifest."
      }
    displayName: Sign VSIX manifest with Azure Key Vault
    condition: >-
      and(
        succeeded(),
        or(
          startsWith(variables['Build.SourceBranch'], 'refs/tags/v')
        )
      )
    env:
      AZURE_TENANT_ID: $(SignTenantId)
      AZURE_CLIENT_ID: $(SignClientId)
      AZURE_CLIENT_SECRET: $(SignClientSecret)
      AZURE_KEY_VAULT_CERTIFICATE: $(SignKeyVaultCertificate)
      AZURE_KEY_VAULT_URL: $(SignKeyVaultUrl)

  - pwsh: |
      npx vsce verify-signature `
        --packagePath .\vscode-nanoframework.vsix `
        --manifestPath .\vscode-nanoframework.signature.manifest `
        --signaturePath .\vscode-nanoframework.signature.p7s
      if ($LASTEXITCODE -ne 0) {
        throw "VSIX signature verification failed."
      }
    displayName: Verify VSIX signature
    condition: >-
      and(
        succeeded(),
        or(
          startsWith(variables['Build.SourceBranch'], 'refs/tags/v')
        )
      )

  - task: CopyFiles@2
    displayName: Collecting deployable artifacts
    condition: succeededOrFailed()
    inputs:
      sourceFolder: $(Build.SourcesDirectory)
      contents: |-
        **\vscode-nanoframework.vsix
        **\vscode-nanoframework.signature.manifest
        **\vscode-nanoframework.signature.p7s
        **\package.json
        assets/marketplace/vscode-marketplace-overview.md
        assets/marketplace/nano-vs-code.gif
      targetFolder: $(Build.ArtifactStagingDirectory)
      flattenFolders: true
    
  # Publish files as an artifact
  - task: PublishBuildArtifacts@1
    displayName: Publish deployables artifacts
    condition: succeededOrFailed()
    inputs:
      ArtifactName: git-mob-vs-code
      PathtoPublish: $(Build.ArtifactStagingDirectory)
      ArtifactType: Container

  - bash: |
      echo ">>> Publish"
      npm run deploy:signed
    displayName: Publish to marketplace
    condition: >-
      and(
        succeeded(),
        startsWith(variables['Build.SourceBranch'], 'refs/tags/v')
      )
    env:
      VSCE_PAT: $(VSCE_PAT)

  # create or update GitHub release
  - task: GithubRelease@1
    condition: >-
      and(
        succeeded(),
        eq(variables['System.PullRequest.PullRequestId'], ''),
        ne(variables['StartReleaseCandidate'], true),
        not(startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
      )
    displayName: Create/Update GitHub release
    inputs:
      gitHubConnection: 'github.com_nano-$(System.TeamProject)'
      tagSource: userSpecifiedTag
      tag: v$(NBGV_SimpleVersion)
      title: '.NET nanoFramework VS Code extension v$(NBGV_SimpleVersion)'
      assets: '$(Build.ArtifactStagingDirectory)/*.vsix'
      isPreRelease: false
      addChangeLog: true
      releaseNotesSource: inline
      changeLogType: issueBased
      changeLogLabels: |
        [
          { "label" : "Type: bug", "displayName" : "Bugs fixed", "state" : "closed" },
          { "label" : "Type: enhancement", "displayName" : "Enhancements and new features", "state" : "closed" },
          { "label" : "Breaking-Change", "displayName" : "Breaking Changes", "state" : "closed" },
          { "label" : "Type: dependencies", "displayName" : "Dependencies updated", "state" : "closed" },
          { "label" : "Type: documentation", "displayName" : "Documentation", "state" : "closed" }
        ]

  # report error
  - template: azure-pipelines-templates/discord-webhook-task.yml@templates  
    parameters:
      status: 'failure'
      webhookUrl: '$(DiscordWebhook)'
      message: ''
